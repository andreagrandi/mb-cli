name: Changelog

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    branches: [ master ]

permissions:
  contents: read
  pull-requests: read

jobs:
  changelog:
    name: Require changelog entry
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' && !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}

    steps:
    - name: Checkout PR
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Check CHANGELOG.md was updated
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail

        changed_files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
        echo "Changed files:"
        echo "$changed_files"
        echo

        # Paths that never require a changelog entry on their own.
        ignored_regex='^(\.github/|tests/|README\.md$|CHANGELOG\.md$|AGENTS\.md$|CLAUDE\.md$|mb-cli-plan\.md$|.*\.png$|LICENSE$)'

        user_visible=$(echo "$changed_files" | grep -Ev "$ignored_regex" || true)

        if [ -z "$user_visible" ]; then
          echo "No user-visible files changed — changelog entry not required."
          exit 0
        fi

        echo "User-visible files changed:"
        echo "$user_visible"
        echo

        if echo "$changed_files" | grep -qx 'CHANGELOG.md'; then
          echo "CHANGELOG.md was updated in this PR."
          exit 0
        fi

        echo "::error::CHANGELOG.md was not updated. Add a one-line bullet under '## [Unreleased]' describing the user-visible change. See 'Changelog Updates' in AGENTS.md. If this change is genuinely user-invisible, add the 'no-changelog' label to this PR."
        exit 1
